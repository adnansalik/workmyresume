spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/workmyresume
    username: workmyresume
    password: workmyresume
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # Schema is owned by Flyway migrations, not Hibernate.
      ddl-auto: none
      show-sql: true
      properties:
        hibernate:
          format_sql: true
    # Disable open-in-view: lazy loading must happen inside @Transactional
    # service methods, not during request/view rendering.
    open-in-view: false

  flyway:
    # Adopt an existing Hibernate-created dev schema as the baseline so the
    # first migration does not try to re-create it.
    baseline-on-migrate: true

  application:
    name: workmyresume

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  server:
    port: 8080

app:
  upload-dir: uploads

  # JWT signing secret. Dev default only - override with APP_JWT_SECRET in production.
  # HS256 requires at least 32 characters.
  jwt:
    secret: CHANGE_THIS_TO_A_32_CHAR_MIN_SECRET_KEY_123456

  # Comma-separated browser origins allowed to call this API (dev frontend default).
  cors:
    allowed-origins: http://localhost:3000

  # Simple in-memory fixed-window rate limit for sensitive paths (e.g. /auth/*).
  rate-limit:
    max-requests: 300
    window-seconds: 60
    paths: /auth/

  # Where the browser lands after a successful OAuth login; receives ?token=<JWT>.
  oauth:
    redirect-url: http://localhost:3000/oauth/callback
    # Providers activate automatically when these are set (e.g. via env):
    #   providers.google-client-id / google-client-secret
    #   providers.github-client-id / github-client-secret

  ai:
    # OpenAI-compatible chat completions endpoint.
    base-url: https://api.openai.com/v1
    model: gpt-4o-mini
    # api-key is NOT set here. Provide it via the APP_AI_APIKEY environment variable.
    # When it is unset or blank, the heuristic analyzer is used instead of the LLM.

  payments:
    razorpay:
      # Set via RAZORPAY_KEY_ID / RAZORPAY_KEY_SECRET. Without them, checkout
      # returns 503 (SERVICE_UNAVAILABLE) rather than making failed calls.
      key-id: ${RAZORPAY_KEY_ID:}
      key-secret: ${RAZORPAY_KEY_SECRET:}
      # Webhook signature secret: RAZORPAY_WEBHOOK_SECRET.
      webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
      base-url: https://api.razorpay.com/v1