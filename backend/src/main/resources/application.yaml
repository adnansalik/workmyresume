spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/workmyresume
    username: workmyresume
    password: workmyresume
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
      show-sql: true
      properties:
        hibernate:
          format_sql: true

  application:
    name: workmyresume

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  server:
    port: 8080

app:
  upload-dir: uploads
  ai:
    # OpenAI-compatible chat completions endpoint.
    base-url: https://api.openai.com/v1
    model: gpt-4o-mini
    # api-key is NOT set here. Provide it via the APP_AI_APIKEY environment variable.
    # When it is unset or blank, the heuristic analyzer is used instead of the LLM.