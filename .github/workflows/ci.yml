name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15.15-trixie
        env:
          POSTGRES_USER: workmyresume
          POSTGRES_PASSWORD: workmyresume
          POSTGRES_DB: workmyresume
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U workmyresume"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # Uses the docker-compose database configuration from application.yaml
      # (localhost:5433), which matches the Postgres service above.
      - name: Run tests
        working-directory: backend
        run: ./mvnw --batch-mode test